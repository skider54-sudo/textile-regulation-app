name: Regulatory Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official regulatory sources
        env:
          KOREA_LAW_OC: ${{ secrets.KOREA_LAW_OC }}
        run: python scripts/run_regulatory_monitor.py

      - name: Commit monitoring snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- data/regulatory_monitor_state.json data/regulatory_monitor_events.json; then
            echo "No monitoring snapshot changes."
            exit 0
          fi
          git config user.name "texreg-monitor[bot]"
          git config user.email "texreg-monitor[bot]@users.noreply.github.com"
          git add data/regulatory_monitor_state.json data/regulatory_monitor_events.json
          git commit -m "chore: update regulatory monitor"
          git push
